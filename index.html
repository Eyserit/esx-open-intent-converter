<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Convert Wi-Fi designs between Ekahau .esx and Open Intent .zip, entirely in your browser.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0908">
  <title>Ekahau ⇄ Open Intent converter</title>
  <!-- An empty icon stops the browser requesting /favicon.ico. -->
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <h1 class="headline">
      <span>Move Wi-Fi designs</span>
      <span class="headline-quiet">between Ekahau and Open Intent.</span>
    </h1>

    <section id="card" class="card" data-state="idle" tabindex="0"
             role="group" aria-labelledby="card-title" aria-describedby="card-detail">
      <div class="card-inner">
        <div class="glyph" aria-hidden="true">
          <svg class="glyph-idle" viewBox="0 0 24 24"><path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5M4 14v3a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-3"/></svg>
          <svg class="glyph-done" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          <svg class="glyph-unsupported" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.75v.01"/></svg>
          <svg class="glyph-converting" viewBox="0 0 24 24"><path d="M5 9h12.5l-3-3M19 15H6.5l3 3"/></svg>
        </div>

        <p id="card-title" class="card-title"></p>
        <p id="card-detail" class="card-detail"></p>

        <div id="progress" class="progress" role="progressbar" aria-label="Conversion progress"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
          <div class="progress-fill"></div>
        </div>

        <div class="actions">
          <button id="choose" class="pill pill-primary" type="button">Choose file</button>
          <a id="download" class="pill pill-primary" href="#" hidden>Download</a>
          <button id="another" class="pill" type="button" hidden>Convert another</button>
          <button id="retry" class="pill" type="button" hidden>Try another file</button>
        </div>
      </div>
    </section>

    <p class="trust">
      <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>
      Files are converted in your browser and never uploaded.
    </p>
  </main>

  <footer class="footer">
    <span>Ekahau .esx ⇄ Open Intent .zip</span>
    <span>No sign-up · Nothing stored</span>
  </footer>

  <div id="status" class="visually-hidden" aria-live="polite"></div>
  <input id="file" type="file" hidden>
</body>
</html>
